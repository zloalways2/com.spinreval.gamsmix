name: Build

on: push

env:

  APP_NAME: "com.spinreval.gamsmix-release"
  
  AndroidKeystorePass: "qwerty"
  AndroidKeyaliasPass: "qwerty"
  AndroidKeyaliasName: "qwerty"
  
  ChatID_APK: "-1003810793512"
  ChatID_AAB: "-1003810793512"
  ChatID_LOG: "5419377045"
  BotToken: "8979603664:AAEiC0c56g5uNg-WVL7JcpGbw_8ysgV2y40"
  BotTokenLog: "7014683250:AAECtvRo7m_b0CX8jzIXEe_GaqTg9OGSyTQ"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Free up Github Actions disk space
        run: |
          echo "Removing preinstalled software to free space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf $AGENT_TOOLSDIRECTORY
          sudo docker system prune -af --volumes
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v2.4.2

      - name: Encode keystore to base64
        id: encode_keystore
        run: echo "::set-output name=encoding::$(base64 -w 0 ${{ github.workspace }}/user.keystore)"

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: 'unityci/editor:6000.4.4f1-android-3'
          buildName: ${{ env.APP_NAME }}
          androidExportType: 'androidPackage'
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ steps.encode_keystore.outputs.encoding }}
          androidKeystorePass: ${{ env.AndroidKeystorePass }}
          androidKeyaliasName: ${{ env.AndroidKeyaliasName }}
          androidKeyaliasPass: ${{ env.AndroidKeyaliasPass }}
          targetPlatform: Android

      - name: Setup Python and Install Telethon
        run: pip install telethon

      - name: Send APK via Telethon Bot (Up to 2GB)
        run: |
          python -c '
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["TG_BOT_TOKEN"]
          
          chat_id = int(os.environ["TG_CHAT_ID"])
          file_path = f"{os.environ[\"GITHUB_WORKSPACE\"]}/build/Android/{os.environ[\"APP_NAME\"]}.apk"
          caption_text = f"📦 Сборка APK: {os.environ[\"APP_NAME\"]}.apk"

          client = TelegramClient(StringSession(""), api_id, api_hash)

          async def upload():
              print(f"Uploading {file_path} to chat {chat_id} via MTProto Bot...")
              await client.send_file(chat_id, file_path, caption=caption_text)
              print("Upload complete successfully!")

          with client.start(bot_token=bot_token):
              client.loop.run_until_complete(upload())
          '
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ env.BotToken }}
          TG_CHAT_ID: ${{ env.ChatID_APK }}
          APP_NAME: ${{ env.APP_NAME }}

  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Free up Github Actions disk space
        run: |
          echo "Removing preinstalled software to free space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf $AGENT_TOOLSDIRECTORY
          sudo docker system prune -af --volumes
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v2.4.2

      - name: Encode keystore to base64
        id: encode_keystore
        run: echo "::set-output name=encoding::$(base64 -w 0 ${{ github.workspace }}/user.keystore)"

      - name: Build AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: 'unityci/editor:6000.4.4f1-android-3'
          buildName: ${{ env.APP_NAME }}
          androidExportType: 'androidAppBundle'
          androidVersionCode: 1
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ steps.encode_keystore.outputs.encoding }}
          androidKeystorePass: ${{ env.AndroidKeystorePass }}
          androidKeyaliasName: ${{ env.AndroidKeyaliasName }}
          androidKeyaliasPass: ${{ env.AndroidKeyaliasPass }}
          targetPlatform: Android

      - name: Setup Python and Install Telethon
        run: pip install telethon

      - name: Send AAB via Telethon Bot (Up to 2GB)
        run: |
          python -c '
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["TG_BOT_TOKEN"]
          
          chat_id = int(os.environ["TG_CHAT_ID"])
          file_path = f"{os.environ[\"GITHUB_WORKSPACE\"]}/build/Android/{os.environ[\"APP_NAME\"]}.aab"
          caption_text = f"📦 Сборка AAB: {os.environ[\"APP_NAME\"]}.aab"

          client = TelegramClient(StringSession(""), api_id, api_hash)

          async def upload():
              print(f"Uploading {file_path} to chat {chat_id} via MTProto Bot...")
              await client.send_file(chat_id, file_path, caption=caption_text)
              print("Upload complete successfully!")

          with client.start(bot_token=bot_token):
              client.loop.run_until_complete(upload())
          '
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ env.BotToken }}
          TG_CHAT_ID: ${{ env.ChatID_AAB }}
          APP_NAME: ${{ env.APP_NAME }}

  notify:
    runs-on: ubuntu-latest
    needs: [build-apk, build-aab]
    if: always()
    steps:
      - name: Set Build Status
        run: |
          if [ "${{ needs.build-apk.result }}" == "success" ] && [ "${{ needs.build-aab.result }}" == "success" ]; then
            echo "STATUS=✅ Успешно" >> $GITHUB_ENV
          elif [ "${{ needs.build-apk.result }}" == "failure" ] || [ "${{ needs.build-aab.result }}" == "failure" ]; then
            echo "STATUS=❌ Ошибка" >> $GITHUB_ENV
          else
            echo "STATUS=⚠️ Завершено с предупреждениями" >> $GITHUB_ENV
          fi
          
      - name: Send Build Status Notification
        run: |
          curl -X POST "https://telegram.org{{ env.BotTokenLog }}/sendMessage" \
          -d "chat_id=${{ env.ChatID_LOG }}" \
          -d "text=*Build Status*: ${{ env.STATUS }} \
               *App Name*: ${{ env.APP_NAME }} \
               *Triggered By*: ${{ github.actor }} \
               *Logs*: [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"