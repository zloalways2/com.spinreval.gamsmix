name: Test

on: push

env:
  TG_CHAT_ID: "-1003810793512"
  BotToken: "8979603664:AAEiC0c56g5uNg-WVL7JcpGbw_8ysgV2y40"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and Install Telethon
        run: pip install telethon

      - name: Check test files
        run: |
          echo "=== Files ==="

          for file in appinfo.txt 1.txt 2.txt 3.txt; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file not found!"
              exit 1
            fi

            SIZE=$(wc -c < "$file")

            echo "$file: ${SIZE} bytes"

            if [ "$SIZE" -eq 0 ]; then
              echo "ERROR: $file is empty!"
              exit 1
            fi
          done

          echo "================"

      - name: Send files to Telegram
        run: |
          python << 'EOF'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          # ---------------------------------------
          # Telegram settings
          # ---------------------------------------

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["TG_BOT_TOKEN"]
          chat_id = int(os.environ["TG_CHAT_ID"])

          workspace = os.environ["GITHUB_WORKSPACE"]

          # ---------------------------------------
          # Files
          # ---------------------------------------

          app_info_path = os.path.join(
              workspace,
              "appinfo.txt"
          )

          txt_paths = [
              os.path.join(workspace, "1.txt"),
              os.path.join(workspace, "2.txt"),
              os.path.join(workspace, "3.txt")
          ]

          # ---------------------------------------
          # Read appinfo.txt
          # ---------------------------------------

          with open(
              app_info_path,
              "r",
              encoding="utf-8"
          ) as f:
              caption = f.read().strip()

          print()
          print("========== APP INFO ==========")
          print(caption)
          print("==============================")
          print()

          # ---------------------------------------
          # Check files
          # ---------------------------------------

          print("========== FILES ==========")

          for path in txt_paths:
              size = os.path.getsize(path)

              print(
                  f"{os.path.basename(path)}: "
                  f"{size} bytes"
              )

          print("===========================")
          print()

          # ---------------------------------------
          # Telegram client
          # ---------------------------------------

          client = TelegramClient(
              StringSession(""),
              api_id,
              api_hash
          )

          async def main():

              await client.start(
                  bot_token=bot_token
              )

              # -----------------------------------
              # Send all 3 files as ONE album
              # appinfo.txt = album caption
              # -----------------------------------

              await client.send_file(
                  chat_id,
                  txt_paths,
                  caption=caption,
                  parse_mode=None
              )

              print(
                  "Album uploaded successfully!"
              )

              await client.disconnect()

          asyncio.run(main())
          EOF

        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ env.BotToken }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}