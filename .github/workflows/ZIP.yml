name: ZIP

on: push

env:
  TG_CHAT_ID: "-1003810793512"
  TG_BOT_TOKEN: "8979603664:AAEiC0c56g5uNg-WVL7JcpGbw_8ysgV2y40"

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and Install Telethon
        run: pip install telethon

      - name: Check files and Create ZIP
        run: |
          echo "=== Archiving Unity Folders ==="
          # Флаг -s 45m автоматически режет архив на части по 45 МБ (unity_project.z01, unity_project.z02, unity_project.zip)
          # Флаг -q отключает лишний спам логов в консоль
          zip -rqs 45m unity_project.zip Assets Packages ProjectSettings UserSettings
          
          echo "=== Created files ==="
          ls -lh unity_project.*
          echo "================"

      - name: Send files to Telegram
        run: |
          python << 'EOF'
          import os
          import glob
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["TG_BOT_TOKEN"]
          chat_id = int(os.environ["TG_CHAT_ID"])
          workspace = os.environ["GITHUB_WORKSPACE"]

          app_info_path = os.path.join(workspace, "appinfo.txt")

          # Находим все созданные части архива (.zip, .z01, .z02 и т.д.) и сортируем их
          zip_parts = sorted(glob.glob(os.path.join(workspace, "unity_project.z*")) + glob.glob(os.path.join(workspace, "unity_project.zip")))

          # Читаем текст для подписи из appinfo.txt
          with open(app_info_path, "r", encoding="utf-8") as f:
              caption = f.read().strip()

          print("\n========== APP INFO ==========")
          print(caption)
          print("==============================\n")

          print("========== ZIP PARTS ==========")
          for part in zip_parts:
              print(f"{os.path.basename(part)}: {os.path.getsize(part)} bytes")
          print("==============================\n")

          client = TelegramClient(StringSession(""), api_id, api_hash)

          async def main():
              await client.start(bot_token=bot_token)

              # Отправляем каждую часть архива отдельно, чтобы не превысить лимит бота в 50 МБ
              for i, part_path in enumerate(zip_parts):
                  print(f"Uploading {os.path.basename(part_path)} to Telegram...")
                  
                  # Привязываем текст из appinfo.txt ТОЛЬКО к первому отправляемому файлу
                  current_caption = caption if i == 0 else ""
                  
                  await client.send_file(
                      chat_id,
                      part_path,
                      caption=current_caption
                  )

              print("All parts uploaded successfully!")
              await client.disconnect()

          asyncio.run(main())
          EOF
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}  # <- ИСПРАВЛЕНО: Теперь берет токен из env выше, а не из secrets
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}