name: Build

on: push

env:
  TG_CHAT_ID: "-1003810793512"
  TG_BOT_TOKEN: "8979603664:AAEiC0c56g5uNg-WVL7JcpGbw_8ysgV2y40"
  APP_NAME: "com.spinreval.gamsmix"
  
  ChatID_LOG: "5419377045"
  BotTokenLog: "7014683250:AAECtvRo7m_b0CX8jzIXEe_GaqTg9OGSyTQ"
  
  AndroidKeystorePass: "qwerty"
  AndroidKeyaliasPass: "qwerty"
  AndroidKeyaliasName: "qwerty"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up Github Actions disk space
        run: |
          echo "Removing preinstalled software to free space..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf $AGENT_TOOLSDIRECTORY
          sudo docker system prune -af --volumes
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v2.4.2

      - name: Find and Encode keystore to base64
        id: encode_keystore
        run: |
          # Находим любой существующий .keystore файл в корне репозитория
          KEYSTORE_FILE=$(ls *.keystore | head -n 1)
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "ERROR: No .keystore file found!"
            exit 1
          fi
          echo "Found keystore: $KEYSTORE_FILE"
          # Сохраняем имя и кодируем в base64 (старый рабочий синтаксис)
          echo "::set-output name=keystore_name::$KEYSTORE_FILE"
          echo "::set-output name=encoding::$(base64 -w 0 "$KEYSTORE_FILE")"

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: 'unityci/editor:6000.4.4f1-android-3'
          buildName: ${{ env.APP_NAME }}
          androidExportType: 'androidPackage'
          # Используем динамическое имя файла вместо захардкоженного user.keystore
          androidKeystoreName: ${{ steps.encode_keystore.outputs.keystore_name }}
          androidKeystoreBase64: ${{ steps.encode_keystore.outputs.encoding }}
          androidKeystorePass: ${{ env.AndroidKeystorePass }}
          androidKeyaliasName: ${{ env.AndroidKeyaliasName }}
          androidKeyaliasPass: ${{ env.AndroidKeyaliasPass }}
          targetPlatform: Android

      - name: Clean Git working directory
        run: |
          git reset --hard HEAD
          sudo git clean -fd -e Library/ -e build/

      - name: Build AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: 'unityci/editor:6000.4.4f1-android-3'
          buildName: ${{ env.APP_NAME }}
          androidExportType: 'androidAppBundle'
          androidVersionCode: 1
          androidKeystoreName: ${{ steps.encode_keystore.outputs.keystore_name }}
          androidKeystoreBase64: ${{ steps.encode_keystore.outputs.encoding }}
          androidKeystorePass: ${{ env.AndroidKeystorePass }}
          androidKeyaliasName: ${{ env.AndroidKeyaliasName }}
          androidKeyaliasPass: ${{ env.AndroidKeyaliasPass }}
          targetPlatform: Android

      - name: Create ZIP Archive
        run: |
          echo "=== Archiving Unity Folders ==="
          # Создаем ZIP-архив. Флаг -q прячет логи тысяч файлов Unity.
          zip -rq "${APP_NAME}.zip" Assets Packages ProjectSettings UserSettings
          echo "ZIP size: $(wc -c < "${APP_NAME}.zip") bytes"
          echo "================"

      - name: Setup Python and Install Telethon
        run: pip install telethon

      - name: Send APK, AAB, ZIP and Keystore together as Album
        run: |
          python << 'EOF'
          import os
          import glob
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["TG_BOT_TOKEN"]
          chat_id = int(os.environ["TG_CHAT_ID"])
          
          workspace = os.environ["GITHUB_WORKSPACE"]
          app_name = os.environ["APP_NAME"]
          
          # Пути к файлам
          app_info_path = os.path.join(workspace, "appinfo.txt")
          zip_path = f"{workspace}/{app_name}.zip"
          apk_path = f"{workspace}/build/Android/{app_name}.apk"
          aab_path = f"{workspace}/build/Android/{app_name}.aab"

          # Ищем keystore файл на диске
          keystore_files = glob.glob(os.path.join(workspace, "*.keystore"))
          keystore_path = keystore_files[0] if keystore_files else None

          # Читаем текст подписи из appinfo.txt
          caption = ""
          if os.path.exists(app_info_path):
              with open(app_info_path, "r", encoding="utf-8") as f:
                  caption = f.read().strip()

          client = TelegramClient(StringSession(""), api_id, api_hash)

          async def upload():
              print("Forming album and uploading via MTProto Bot...")
              
              # Собираем список всех существующих файлов
              album_files = []
              
              if os.path.exists(zip_path):
                  album_files.append(zip_path)
              if keystore_path and os.path.exists(keystore_path):
                  album_files.append(keystore_path)
              if os.path.exists(apk_path):
                  album_files.append(apk_path)
              if os.path.exists(aab_path):
                  album_files.append(aab_path)

              if not album_files:
                  print("No files found to upload!")
                  return

              # Отправляем файлы списком (альбомом). Подпись прикрепится к первому файлу.
              await client.send_file(chat_id, album_files, caption=caption, parse_mode=None)
              print("All 4 files uploaded successfully as one album!")

          with client.start(bot_token=bot_token):
              client.loop.run_until_complete(upload())
          EOF
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ env.BotToken }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          APP_NAME: ${{ env.APP_NAME }}

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Set Build Status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "STATUS=✅ Успешно" >> $GITHUB_ENV
          else
            echo "STATUS=❌ Ошибка" >> $GITHUB_ENV
          fi
          
      - name: Send Build Status Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ env.BotTokenLog }}/sendMessage" \
          -d "chat_id=${{ env.ChatID_LOG }}" \
          -d "text=*Build Status*: ${{ env.STATUS }} %0A*App Name*: ${{ env.APP_NAME }} %0A*Triggered By*: ${{ github.actor }} %0A*Logs*: [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"