apply plugin: 'com.android.library'

// Безопасное подключение скриптов Unity для CI
if (file('../shared/keepUnitySymbols.gradle').exists()) {
    apply from: '../shared/keepUnitySymbols.gradle'
}
if (file('../shared/common.gradle').exists()) {
    apply from: '../shared/common.gradle'
}

**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.annotation:annotation:1.7.1' // Assets/appmetrica/Editor/AppMetricaDependencies.xml:5
    implementation 'io.appmetrica.analytics:analytics:8.1.0' // Assets/appmetrica/Editor/AppMetricaDependencies.xml:4
// Android Resolver Dependencies End
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    // Корректный синтаксис упаковки для Gradle 8.0 внутри блока android
    packaging {
        resources {
            excludes += '/lib/armeabi/**'
            excludes += '/lib/mips/**'
            excludes += '/lib/mips64/**'
            excludes += '/lib/x86/**'
            excludes += '/lib/x86_64/**'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**